<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f8f6ef" />
    <title>Geo Go Go</title>
    <style>
      :root {
        color: var(--ui-ink, #183740);
        background: #61acd3;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }

      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        min-width: 320px;
        margin: 0;
        overflow: hidden;
      }

      .boot-shell {
        position: fixed;
        inset: 0;
        display: grid;
        grid-template-rows: calc(62px + env(safe-area-inset-top)) minmax(0, 1fr);
        background: #61acd3;
      }

      .boot-header {
        display: flex;
        align-items: center;
        padding: env(safe-area-inset-top) max(1.5rem, env(safe-area-inset-right)) 0 max(1.5rem, env(safe-area-inset-left));
        background: var(--ui-paper, #f8f6ef);
        border-bottom: 1px solid var(--ui-border, #d4ddd9);
        box-shadow: var(--ui-shadow-control, 0 3px 12px rgb(24 55 64 / 8%));
      }

      .boot-header h1 {
        margin: 0;
        color: var(--ui-ink, #183740);
        font-size: 1.25rem;
        font-family: var(--ui-font-display, ui-sans-serif, system-ui, sans-serif);
        font-weight: var(--ui-weight-display, 600);
        font-stretch: var(--ui-width-display, 84%);
        letter-spacing: -0.035em;
        line-height: 1;
      }

      .boot-map {
        display: grid;
        place-items: center;
      }

      .boot-status {
        display: flex;
        align-items: center;
        gap: 0.7rem;
        padding: 0.7rem 1rem;
        border-radius: var(--ui-radius-control, 12px);
        color: var(--ui-text, #52676e);
        background: var(--ui-panel, rgb(248 246 239 / 96%));
        box-shadow: var(--ui-shadow-panel, 0 12px 30px rgb(24 55 64 / 16%));
        font-size: 0.85rem;
        font-weight: var(--ui-weight, 480);
      }

      .boot-status::before {
        width: 0.8rem;
        height: 0.8rem;
        border: 2px solid rgb(82 103 110 / 22%);
        border-top-color: var(--ui-ink, #183740);
        border-radius: 50%;
        animation: boot-spin 700ms linear infinite;
        content: "";
      }

      .boot-status--error::before { display: none; }

      @keyframes boot-spin { to { transform: rotate(360deg); } }

      @media (max-width: 680px) {
        .boot-header h1 {
          position: absolute;
          width: 1px;
          height: 1px;
          overflow: hidden;
          clip: rect(0, 0, 0, 0);
          white-space: nowrap;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-status::before { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <main class="boot-shell" aria-labelledby="boot-title">
        <header class="boot-header"><h1 id="boot-title">Where in the world?</h1></header>
        <section class="boot-map">
          <p id="boot-status" class="boot-status" role="status">Loading map…</p>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
