<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1726" />
    <title>Geo Go Go</title>
    <style>
      :root {
        color: #172d38;
        background: #61acd3;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }

      html,
      body,
      #app {
        width: 100%;
        height: 100%;
        min-width: 320px;
        margin: 0;
        overflow: hidden;
      }

      .boot-shell {
        position: fixed;
        inset: 0;
        display: grid;
        grid-template-rows: calc(62px + env(safe-area-inset-top)) minmax(0, 1fr);
        background: #61acd3;
      }

      .boot-header {
        display: flex;
        align-items: center;
        padding: env(safe-area-inset-top) max(1.5rem, env(safe-area-inset-right)) 0 max(1.5rem, env(safe-area-inset-left));
        background: linear-gradient(110deg, #f1f7f7, #e8f3f6 62%, #f5f7f5);
        box-shadow: 0 2px 14px rgb(23 45 56 / 8%);
      }

      .boot-header h1 {
        margin: 0;
        color: #102e40;
        font-size: 1.25rem;
        letter-spacing: -0.055em;
        line-height: 1;
      }

      .boot-map {
        display: grid;
        place-items: center;
      }

      .boot-status {
        display: flex;
        align-items: center;
        gap: 0.7rem;
        padding: 0.7rem 1rem;
        border-radius: 999px;
        color: #52676e;
        background: rgb(255 255 255 / 88%);
        box-shadow: 0 6px 24px rgb(23 45 56 / 12%);
        font-size: 0.85rem;
        font-weight: 750;
      }

      .boot-status::before {
        width: 0.8rem;
        height: 0.8rem;
        border: 2px solid rgb(82 103 110 / 22%);
        border-top-color: #102e40;
        border-radius: 50%;
        animation: boot-spin 700ms linear infinite;
        content: "";
      }

      .boot-status--error::before { display: none; }

      @keyframes boot-spin { to { transform: rotate(360deg); } }

      @media (max-width: 680px) {
        .boot-header h1 {
          position: absolute;
          width: 1px;
          height: 1px;
          overflow: hidden;
          clip: rect(0, 0, 0, 0);
          white-space: nowrap;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-status::before { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <main class="boot-shell" aria-labelledby="boot-title">
        <header class="boot-header"><h1 id="boot-title">Where in the world?</h1></header>
        <section class="boot-map">
          <p id="boot-status" class="boot-status" role="status">Loading map…</p>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
